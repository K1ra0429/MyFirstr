<div class="field"><label for="lf-title">Title <span class="mono" data-count-for="lf-title">${v.title.length}/120</span></label>
<input id="lf-title" type="text" maxlength="120" value="${esc(v.title)}" placeholder="e.g. Schrödinger equation — time-independent" data-counter="120" data-autofocus aria-describedby="lf-title-err" required><p class="field-err" id="lf-title-err" hidden></p></div>
<div class="form-row"><div class="field"><label for="lf-cat">Category</label><select id="lf-cat">${LIB_CATEGORIES.map(c=>`<option value="${c.id}"${v.category===c.id?' selected':''}>${esc(c.label)}</option>`).join('')}</select></div>
<div class="field"><label for="lf-project">Linked project</label><select id="lf-project">${projectOptionsHTML(v.projectId)}</select></div></div>
<div class="field"><label for="lf-content">Content <span class="mono" data-count-for="lf-content">${v.content.length}/5000</span></label>
<textarea id="lf-content" maxlength="5000" data-counter="5000" style="min-height:130px" placeholder="Formula text, note body, reference details…">${esc(v.content)}</textarea></div>
<div class="form-info">${icon('info',14)}<span>Content is stored as plain text. Formula evaluation and rendering arrive with Math Lab.</span></div></div>
<div class="modal-foot"><button type="button" class="btn btn-secondary" data-action="modal-close">Cancel</button><button type="submit" class="btn btn-primary" id="lf-submit">${icon(isEdit?'check':'plus',14)}${isEdit?'Save Changes':'Save Item'}</button></div></form>`,
onMount(el){let busy=false;$('#lib-form',el).addEventListener('submit',e=>{e.preventDefault();if(busy)return;
const title=$('#lf-title',el).value.trim();fieldErr('lf-title',!title?'Title is required.':'');if(!title){$('#lf-title',el).focus();return;}
const category=$('#lf-cat',el).value;if(!LIBCAT[category])return;
busy=true;$('#lf-submit',el).disabled=true;
const data={title,category,content:$('#lf-content',el).value.trim(),projectId:$('#lf-project',el).value||null};
if(isEdit){Store.updateLibItem(edit.id,data);Modal.close();toast(`“${title}” updated`);if(Drawer.isOpen&&Drawer.kind==='library'&&Drawer.id===edit.id)openLibraryDrawer(edit.id);}
else{const l=Store.createLibraryItem(data);Modal.close();toast(`“${title}” saved to library`);openLibraryDrawer(l.id);}});}});}

/* ================= DATA I/O ================= */
function doExport(){const json=Store.exportPayload();const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');const d=new Date();a.href=url;a.download=`simulab-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup exported');}
async function handleImportFile(file){if(!file)return;let raw;
try{const text=await file.text();raw=JSON.parse(text);}catch(e){Store.notify('error','Import failed','The selected file is not readable JSON.');toast('Import failed — not a valid SIMULAB backup file.',{type:'error'});return;}
const looksValid=raw&&typeof raw==='object'&&(Array.isArray(raw.projects)||Array.isArray(raw.experiments)||Array.isArray(raw.library));
if(!looksValid){Store.notify('error','Import failed','The file does not contain SIMULAB record arrays.');toast('Import failed — not a valid SIMULAB backup file.',{type:'error'});return;}
const{state,dropped}=sanitizeState(raw);
confirmDialog({title:'Import backup?',message:`Replace current records with <b>${state.projects.length} projects, ${state.experiments.length} experiments, ${state.library.length} library items</b>? Current data will be overwritten. Preferences are kept.${dropped?`<br><br>${dropped} invalid record(s) in the file will be skipped.`:''}`,confirmLabel:'Replace & import',onConfirm(){Store.importPayload(raw);toast('Backup imported');}});}
function updateList(scope){
if(scope==='dash-projects'||scope==='page-projects'){updateProjectList(scope);return;}
if(scope==='page-experiments'){const el=$('[data-list="page-experiments"]');if(!el)return;el.innerHTML=expRowsHTML();const ul=$('ul',el),cnt=$('[data-count="page-experiments"]');if(cnt)cnt.textContent=(ul?ul.dataset.total:0)+' results';return;}
if(scope==='page-library'){const el=$('[data-list="page-library"]');if(!el)return;el.innerHTML=libGridHTML();const grid=$('.lib-grid',el),cnt=$('[data-count="page-library"]');if(cnt)cnt.textContent=(grid?grid.dataset.total:0)+' results';return;}
if(scope==='page-activity'){const el=$('[data-list="page-activity"]');if(el)el.innerHTML=activityPageHTML();}}

/* ================= ACTIONS ================= */
const actions={
'pref-toggle':el=>{const key=el.dataset.pref;Store.setPref(key,!Store.state.prefs[key]);},
'open-drawer':()=>openMobileDrawer(),'close-drawer':()=>closeMobileDrawer(),
'open-search':()=>Search.open(),'search-clear':()=>Search.setQuery(''),
'search-result':el=>Search.openResult(+el.dataset.idx),
'search-create-project':()=>{const q=Search.q.trim().slice(0,80);Search.close();openProjectForm({presetName:q});},
'open-notifications':el=>openNotifications(el),'open-profile':el=>openProfile(el),
'open-workspace-menu':el=>openWorkspaceMenu(el),'open-quickcreate':el=>openQuickCreate(el),
'open-about':()=>{Popover.close();openAbout();},
'row-menu':el=>openRowMenu(el,el.dataset.kind,el.dataset.id),
'notif-item':el=>{Store.markNotifRead(el.dataset.id);refreshNotifications();},
'notif-mark-all':()=>{Store.markAllNotifRead();refreshNotifications();},
'notif-clear':()=>{Store.clearNotifs();refreshNotifications();},
'new-project':el=>{Popover.close();openProjectForm({presetDiscipline:el.dataset.discipline});},
'edit-project':el=>{Popover.close();openProjectForm({project:el.dataset.id});},
'archive-project':el=>{Popover.close();const p=Store.archiveProject(el.dataset.id);if(p)toast(`“${p.name}” archived`,{type:'info',actionLabel:'Undo',onAction(){Store.restoreProject(p.id);toast('Project restored');}});},
'restore-project':el=>{Popover.close();const p=Store.restoreProject(el.dataset.id);if(p)toast(`“${p.name}” restored`);},
'delete-project':el=>{Popover.close();const id=el.dataset.id;const p=Store.getProject(id);if(!p)return;
const expN=Store.state.experiments.filter(e=>e.projectId===id).length;const libN=Store.state.library.filter(l=>l.projectId===id).length;
const related=(expN||libN)?` ${expN} experiment(s) and ${libN} library item(s) will be <b>kept and unlinked</b>, not deleted.`:' No linked records exist.';
confirmDialog({title:'Delete project?',message:`<b>“${esc(p.name)}”</b> will be permanently removed from this browser.${related}`,confirmLabel:'Delete project',onConfirm(){const r=parseRoute();if(r.base==='projects'&&r.param===id)location.hash='#/projects';const snap=Store.deleteProject(id);toast(`Project “${p.name}” deleted`,{type:'info',actionLabel:'Undo',onAction(){if(Store.undoDelete(snap))toast('Project restored');}});}});},
'new-experiment':el=>{Popover.close();openExperimentForm({presetProject:el.dataset.project});},
'open-experiment':el=>{Popover.close();openExperimentDrawer(el.dataset.id);},
'edit-experiment':el=>{Popover.close();openExperimentForm({experiment:el.dataset.id});},
'delete-experiment':el=>{Popover.close();const e=Store.getExperiment(el.dataset.id);if(!e)return;
confirmDialog({title:'Delete experiment?',message:`<b>“${esc(e.title)}”</b> and its notes will be removed. You can undo right after.`,confirmLabel:'Delete experiment',onConfirm(){if(Drawer.isOpen&&Drawer.kind==='experiment'&&Drawer.id===e.id)Drawer.close();const snap=Store.deleteExperiment(e.id);toast(`Experiment “${e.title}” deleted`,{type:'info',actionLabel:'Undo',onAction(){if(Store.undoDelete(snap))toast('Experiment restored');}});}});},
'new-library':el=>{Popover.close();openLibraryForm({presetCategory:el.dataset.category,presetProject:el.dataset.project});},
'open-library':el=>{Popover.close();openLibraryDrawer(el.dataset.id);},
'edit-library':el=>{Popover.close();openLibraryForm({item:el.dataset.id});},
'delete-library':el=>{Popover.close();const l=Store.getLibItem(el.dataset.id);if(!l)return;
confirmDialog({title:'Delete library item?',message:`<b>“${esc(l.title)}”</b> will be removed from your library. You can undo right after.`,confirmLabel:'Delete item',onConfirm(){if(Drawer.isOpen&&Drawer.kind==='library'&&Drawer.id===l.id)Drawer.close();const snap=Store.deleteLibItem(l.id);toast(`“${l.title}” deleted`,{type:'info',actionLabel:'Undo',onAction(){if(Store.undoDelete(snap))toast('Item restored');}});}});},
'open-workspace':()=>{const c=Store.state.projects.filter(p=>p.status!=='archived'&&p.lastOpenedAt).sort((a,b)=>Date.parse(b.lastOpenedAt)-Date.parse(a.lastOpenedAt));location.hash=c.length?'#/projects/'+c[0].id:'#/projects';},
'explore-modules':()=>{const m=$('#modules');if(m)m.scrollIntoView({behavior:Store.state.prefs.reduceMotion?'auto':'smooth',block:'start'});},
'reset-filters':el=>{const scope=el.dataset.scope;ui[scope]=JSON.parse(JSON.stringify(FILTER_DEFAULTS[scope]));renderRoute();},
'lib-chip':el=>{ui['page-library'].cat=el.dataset.cat;renderRoute();const chip=$(`.chip-btn[data-cat="${el.dataset.cat}"]`);if(chip)chip.focus();},
'copy-id':el=>{const id=el.dataset.id;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(id).then(()=>toast('ID copied to clipboard')).catch(()=>toast('Copy unavailable — ID: '+id,{type:'info'}));}else toast('Copy unavailable — ID: '+id,{type:'info'});},
'export-data':()=>{Popover.close();doExport();},
'import-data':()=>{const f=$('#import-file');if(f)f.click();},
'reset-workspace':()=>{confirmDialog({title:'Reset workspace?',message:'<b>All projects, experiments, library items, activity and notifications</b> will be permanently deleted from this browser. Preferences are kept. Export a backup first if you need one.',confirmLabel:'Reset everything',onConfirm(){Store.resetWorkspace();toast('Workspace reset',{type:'info'});}});},
'clear-activity':()=>{confirmDialog({title:'Clear activity history?',message:'The event log will be emptied. Your projects, experiments and library items are not affected.',confirmLabel:'Clear history',onConfirm(){Store.clearActivity();toast('Activity history cleared',{type:'info'});}});},
'modal-close':()=>Modal.close(),'drawer-close':()=>Drawer.close()
};

/* ================= SHELL ================= */
function buildSidebar(){const sb=$('#sidebar');
sb.innerHTML=`<div class="sb-head"><a class="brand" href="#/dashboard" aria-label="SIMULAB — dashboard">${LOGO_SVG}<span class="brand-text hide-c"><b>SIMULAB</b><i>RESEARCH WORKSPACE</i></span></a>
<button type="button" class="btn-icon sb-toggle" data-action="pref-toggle" data-pref="sidebarCollapsed" aria-label="Collapse sidebar">${icon('panel-left',16)}</button>
<button type="button" class="btn-icon sb-close" data-action="close-drawer" aria-label="Close navigation">${icon('x',16)}</button></div>
<nav class="sb-nav" aria-label="Modules and tools">${NAV_GROUPS.map(g=>`<div class="sb-group-label hide-c">${esc(g.label)}</div>${g.items.map(i=>`<a class="nav-item" href="#/${i.route}" data-route="${i.route}" data-label="${esc(i.label)}">${icon(i.icon,17)}<span class="nav-label hide-c">${esc(i.label)}</span></a>`).join('')}`).join('')}</nav>
<div class="sb-foot">
<button type="button" class="nav-item" style="width:100%" data-action="open-notifications" data-label="Notifications" aria-haspopup="dialog" aria-expanded="false">${icon('bell',17)}<span class="nav-label hide-c">Notifications</span><span class="badge" id="sb-bell-badge" hidden></span></button>
<a class="nav-item" href="#/help" data-route="help" data-label="Help Center">${icon('help',17)}<span class="nav-label hide-c">Help Center</span></a>
<a class="nav-item" href="#/settings" data-route="settings" data-label="Settings">${icon('settings',17)}<span class="nav-label hide-c">Settings</span></a>
<button type="button" class="sb-profile" data-action="open-profile" data-label="Local profile" aria-haspopup="menu" aria-expanded="false" aria-label="Profile menu"><span class="avatar">${icon('user',15)}</span><span class="sb-profile-text hide-c"><b>Local Profile</b><i>BROWSER WORKSPACE</i></span><span class="hide-c" style="color:var(--text-3)">${icon('chevron-down',13)}</span></button></div>`;}
function buildTopbar(){$('#topbar').innerHTML=`<div class="tb-left">
<button type="button" class="btn-icon tb-menu" data-action="open-drawer" aria-label="Open navigation" aria-expanded="false">${icon('menu',18)}</button>
<div class="tb-context"><div class="tb-crumb mono" id="tb-crumb">SIMULAB / DASHBOARD</div><div class="tb-title" id="tb-title">Dashboard</div></div></div>
<div class="tb-center"><button type="button" class="tb-search" data-action="open-search" aria-label="Open global search" aria-keyshortcuts="Control+K Meta+K">${icon('search',15)}<span class="tb-search-ph">Search in SIMULAB…</span><kbd class="kbd">${isMac?'⌘ K':'Ctrl K'}</kbd></button>
<button type="button" class="btn-icon tb-search-icon" data-action="open-search" aria-label="Open global search">${icon('search',17)}</button></div>
<div class="tb-right"><span class="mem-chip mono" id="tb-mem" hidden data-tip="localStorage unavailable — data is kept in memory for this session only">MEM</span>
<button type="button" class="tb-ws" data-action="open-workspace-menu" aria-haspopup="menu" aria-expanded="false" aria-label="Workspace selector">${icon('folder',14)}<span class="tb-ws-label" id="tb-ws-label">Research Workspace</span>${icon('chevron-down',13)}</button>
<button type="button" class="btn btn-primary btn-sm tb-create" data-action="open-quickcreate" aria-haspopup="menu" aria-expanded="false" aria-label="Quick create">${icon('plus',14)}<span class="hide-sm">Create</span></button>
<button type="button" class="btn-icon" data-action="open-notifications" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false" data-tip="Notifications">${icon('bell',17)}<span class="badge" id="tb-bell-badge" hidden></span></button>
<button type="button" class="tb-avatar" data-action="open-profile" aria-label="Profile menu" aria-haspopup="menu" aria-expanded="false" data-tip="Local profile">${icon('user',16)}</button></div>`;}
function renderShellBadges(){const unread=Store.state.notifications.filter(n=>!n.read).length;
['tb-bell-badge','sb-bell-badge'].forEach(id=>{const el=$('#'+id);if(!el)return;el.hidden=unread===0;el.textContent=unread>9?'9+':String(unread);});
const mem=$('#tb-mem');if(mem)mem.hidden=Store.storageOk;
$$('[data-action="open-notifications"]').forEach(b=>b.setAttribute('aria-label',unread?`Notifications, ${unread} unread`:'Notifications'));}
function updateSidebarTips(){const collapsed=$('#app').classList.contains('sb-collapsed')&&innerWidth>1023;
$$('#sidebar [data-label]').forEach(el=>{if(collapsed)el.setAttribute('data-tip',el.dataset.label);else el.removeAttribute('data-tip');});
const t=$('.sb-toggle');if(t){const isC=Store.state.prefs.sidebarCollapsed;t.setAttribute('aria-label',isC?'Expand sidebar':'Collapse sidebar');t.setAttribute('data-tip',isC?'Expand sidebar':'Collapse sidebar');}}
function applyPrefs(){const p=Store.state.prefs;$('#app').classList.toggle('sb-collapsed',!!p.sidebarCollapsed);document.documentElement.classList.toggle('reduce-motion',!!p.reduceMotion);updateSidebarTips();}
function setActiveNav(base){$$('#sidebar a[data-route]').forEach(a=>{const on=a.dataset.route===base;a.classList.toggle('active',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}
function openMobileDrawer(){const app=$('#app');if(app.classList.contains('drawer-open'))return;app.classList.add('drawer-open');const scrim=$('#scrim');scrim.hidden=false;requestAnimationFrame(()=>scrim.classList.add('show'));lockScroll();$('.tb-menu').setAttribute('aria-expanded','true');$('#sidebar').setAttribute('role','dialog');$('#sidebar').setAttribute('aria-modal','true');const first=$('#sidebar a, #sidebar button');if(first)first.focus();}
function closeMobileDrawer(){const app=$('#app');if(!app.classList.contains('drawer-open'))return;app.classList.remove('drawer-open');const scrim=$('#scrim');scrim.classList.remove('show');setTimeout(()=>{if(!app.classList.contains('drawer-open'))scrim.hidden=true;},200);unlockScroll();const menu=$('.tb-menu');menu.setAttribute('aria-expanded','false');$('#sidebar').removeAttribute('role');$('#sidebar').removeAttribute('aria-modal');if(innerWidth<=1023)menu.focus();}
function closeAllOverlays(){Popover.close();Search.close();Modal.close();Drawer.close();closeMobileDrawer();Tooltip.hide();}

/* ================= ROUTER ================= */
function parseRoute(){const raw=(location.hash||'#/dashboard').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);return {base:parts[0]||'dashboard',param:parts[1]||null,raw};}
const CORE_ROUTES={dashboard:{title:'Dashboard',view:DashboardView},projects:{title:'Projects',view:ProjectsView},experiments:{title:'Experiments',view:ExperimentsView},library:{title:'Library',view:LibraryView},activity:{title:'Activity',view:ActivityView},settings:{title:'Settings',view:SettingsView},help:{title:'Help Center',view:HelpView}};
function renderRoute(opts){opts=opts||{};const r=parseRoute();let title,html,crumbExtra='';
if(r.base==='projects'&&r.param){const p=Store.getProject(r.param);if(p)Store.touchOpen(r.param);title=p?p.name:'Project not found';crumbExtra='PROJECTS / ';html=ProjectDetailView(r.param);}
else if(CORE_ROUTES[r.base]&&!r.param){title=CORE_ROUTES[r.base].title;html=CORE_ROUTES[r.base].view();}
else if(DEST[r.base]&&!r.param){title=DEST[r.base].name;html=PlaceholderView(DEST[r.base]);}
else{title='Not found';html=NotFoundView(r.raw);}
$('#main').innerHTML=html;document.title=title+' — SIMULAB';
const crumb=$('#tb-crumb'),tt=$('#tb-title'),ws=$('#tb-ws-label');
if(crumb)crumb.textContent=('SIMULAB / '+crumbExtra+title).toUpperCase();
if(tt)tt.textContent=title;
if(ws){if(r.base==='projects'&&r.param){const p=Store.getProject(r.param);ws.textContent=p?p.name:'Research Workspace';}else ws.textContent='Research Workspace';}
setActiveNav(r.base);renderShellBadges();
if(opts.focus){window.scrollTo(0,0);$('#main').focus({preventScroll:true});}}

/* ================= INIT ================= */
function bindGlobal(){
document.addEventListener('click',e=>{
const link=e.target.closest('a[href^="#/"]');
if(link){Popover.close();closeMobileDrawer();if(Modal.isOpen)Modal.close();if(Drawer.isOpen)Drawer.close();}
const t=e.target.closest('[data-action]');
if(t&&actions[t.dataset.action]){if(t.tagName==='A'||t.getAttribute('role')==='button')e.preventDefault();actions[t.dataset.action](t,e);}
});
document.addEventListener('keydown',e=>{
if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(Search.isOpen)Search.close();else if(!Modal.isOpen&&!Drawer.isOpen)Search.open();return;}
if(e.key==='Escape'){if(Search.isOpen){Search.close();return;}if(Modal.isOpen){Modal.close();return;}if(Drawer.isOpen){Drawer.close();return;}if(Popover.el){Popover.close(true);return;}if($('#app').classList.contains('drawer-open')){closeMobileDrawer();return;}}
if(e.key==='Tab'){if(Search.isOpen&&Search.panel)trapTab(Search.panel,e);else if(Modal.isOpen&&Modal.el)trapTab(Modal.el,e);else if(Drawer.isOpen&&Drawer.el)trapTab(Drawer.el,e);else if($('#app').classList.contains('drawer-open'))trapTab($('#sidebar'),e);}
if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.lib-card[role="button"]')){e.preventDefault();openLibraryDrawer(e.target.dataset.id);}
});
document.addEventListener('input',e=>{
const f=e.target.closest('input[data-filter]');if(f){ui[f.dataset.scope][f.dataset.filter]=f.value;updateList(f.dataset.scope);return;}
const c=e.target.closest('[data-counter]');if(c){const out=$(`[data-count-for="${c.id}"]`);if(out)out.textContent=c.value.length+'/'+c.dataset.counter;}
});
document.addEventListener('change',e=>{
const f=e.target.closest('select[data-filter]');if(f){ui[f.dataset.scope][f.dataset.filter]=f.value;updateList(f.dataset.scope);return;}
const pc=e.target.closest('[data-pref-change]');if(pc){Store.setPref(pc.dataset.prefChange,pc.value);return;}
const cs=e.target.closest('[data-change="project-status"]');if(cs){const p=Store.setProjectStatus(cs.dataset.id,cs.value);if(p)toast(`Status set to ${PSTAT[p.status].label}`);return;}
if(e.target.id==='import-file'){handleImportFile(e.target.files&&e.target.files[0]);e.target.value='';}
});
window.addEventListener('hashchange',()=>{closeAllOverlays();renderRoute({focus:true});});
window.addEventListener('resize',()=>{Popover.close();Tooltip.hide();if(innerWidth>1023)closeMobileDrawer();updateSidebarTips();});
window.addEventListener('storage',e=>{if(e.key!==DB_KEY||e.newValue==null)return;try{const{state}=sanitizeState(JSON.parse(e.newValue));Store.state=state;applyPrefs();renderShellBadges();renderRoute();}catch(err){}});
$('#scrim').addEventListener('pointerdown',closeMobileDrawer);
document.addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const t=e.target.closest('[data-tip]');if(t&&!t.contains(e.relatedTarget))Tooltip.schedule(t);});
document.addEventListener('pointerout',e=>{const t=e.target.closest('[data-tip]');if(t&&!t.contains(e.relatedTarget))Tooltip.hide();});
document.addEventListener('focusin',e=>{const t=e.target.closest('[data-tip]');if(t)Tooltip.show(t);});
document.addEventListener('focusout',()=>Tooltip.hide());
document.addEventListener('click',()=>Tooltip.hide(),true);
window.addEventListener('scroll',()=>Tooltip.hide(),true);
setInterval(()=>{$$('time[datetime]').forEach(t=>{t.textContent=timeLabel(t.getAttribute('datetime'));});},45000);
}
function init(){Tooltip.init();Store.load();buildSidebar();buildTopbar();applyPrefs();bindGlobal();
if(!location.hash){try{history.replaceState(null,'','#/dashboard');}catch(e){location.hash='#/dashboard';}}
renderRoute();Store.save();}
init();
</script>
</body>
