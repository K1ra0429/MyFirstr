<!--У базового шаблона попросили главный блок-->

<div class="main_block d-flex justify-content-between">

    <div class="col-8">

        <div class="list_games row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

            {% endfor %}
        </div>

    </div>

    <!--  Блок для кнопок категорий  -->

        {% include 'HDrezka/components/_categories.html' %}

    </div>

</div>


{% endblock main %}
