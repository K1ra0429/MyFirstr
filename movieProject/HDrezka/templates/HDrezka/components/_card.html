
<div class="col">
    <a href="{{ movie.get_absolute_url }}" style="text-decoration: none;">
        <div class="card h-100">
            <img src="{{ movie.photo.url }}" class="card-img" height="320px">
            <div class="card-body">
                <h6 class="card-title">{{ movie.title }}</h6>
                <small>{{ movie.released }}</small>
            </div>

            <div class="d-flex justify-content-between p-3">
                <small><i class="bi bi-eye"></i> {{ movie.views }}</small>
                <small><i class="bi bi-chat-dots"></i> 0</small>
            </div>

        </div>
    </a>
</div>
