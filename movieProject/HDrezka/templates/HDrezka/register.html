{% extends 'base.html' %}

{% block main %}

<div class="d-flex justify-content-center">

    <div class="col-5">
        <div class="card card-body bg-dark text-light">
            <h4 class="text-center">{{ title }}</h4>
            <form action="{% url 'register' %}" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-success w-100" type="submit">Подтвердить</button>
                <hr>
                <p>Уже есть аккаунт ?</p>
                <a href="{% url 'login' %}" class="btn btn-primary w-100">Войти</a>
            </form>

        </div>
    </div>

</div>

{% endblock main %}
